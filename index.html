<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web to DEB Builder</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f8fafc;
      color: #0f172a;
    }
    .card {
      max-width: 650px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    h2 { margin-top: 0; color: #1e293b; font-size: 20px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #475569; }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .file-row { display: flex; align-items: center; gap: 12px; }
    button {
      cursor: pointer;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      transition: background 0.15s ease;
    }
    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
      padding: 9px 16px;
      font-size: 13px;
    }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-primary {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      padding: 12px;
      font-size: 15px;
      margin-top: 8px;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
    #iconPathDisplay {
      font-size: 12px;
      color: #64748b;
      word-break: break-all;
    }
    #status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      background: #0f172a;
      color: #f1f5f9;
      max-height: 220px;
      overflow-y: auto;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      line-height: 1.5;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Web to DEB Builder</h2>

    <div class="field">
      <label for="appName">App Name</label>
      <input type="text" id="appName" placeholder="e.g. Lovable Chat" value="Lovable Chat">
    </div>

    <div class="field">
      <label for="appUrl">Web App URL</label>
      <input type="text" id="appUrl" placeholder="https://example.com" value="https://lovable.dev/chats">
    </div>

    <div class="field">
      <label>App Icon (PNG)</label>
      <div class="file-row">
        <button type="button" class="btn-secondary" id="browseIconBtn">Browse PNG Icon</button>
        <span id="iconPathDisplay">No icon selected</span>
      </div>
    </div>

    <button type="button" class="btn-primary" id="buildBtn">Generate .deb Package</button>

    <div id="status"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
